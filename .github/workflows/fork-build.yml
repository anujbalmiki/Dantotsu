name: Build fork APK

# Builds the same variant the upstream beta workflow ships (googleAlpha, application id
# ani.dantotsu.beta) and uploads the APKs as a run artifact. No Discord/Telegram, no releases.

on:
  push:
    branches-ignore:
      - main
      - l10n_dev_crowdin
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository != 'rebelonion/Dantotsu'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: v1-${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            v1-${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode keystore
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "$KEYSTORE_FILE" | base64 -d > "$GITHUB_WORKSPACE/key.keystore"
          fi

      - name: Build googleAlpha
        run: |
          if [ -s "$GITHUB_WORKSPACE/key.keystore" ]; then
            echo "Signing with the repository keystore"
            ./gradlew assembleGoogleAlpha --no-daemon --stacktrace \
              -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/key.keystore \
              -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
              -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
              -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"
          else
            echo "No keystore secret set; falling back to the throwaway debug key"
            ./gradlew assembleGoogleAlpha --no-daemon --stacktrace
          fi

      - name: Checksums
        run: |
          cd app/build/outputs/apk/google/alpha
          ls -l
          sha256sum *.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: dantotsu-fork-apk-${{ github.sha }}
          path: app/build/outputs/apk/google/alpha/*.apk
          if-no-files-found: error
          retention-days: 30
