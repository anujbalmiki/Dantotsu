name: Build fork APK

# Builds the same variant the upstream beta workflow ships (googleAlpha, application id
# ani.dantotsu.beta) and uploads the APKs as a run artifact. A manual run with "release" ticked
# also publishes them as the Latest GitHub release, so nothing has to pass through a local PC.

on:
  push:
    branches-ignore:
      - main
      - l10n_dev_crowdin
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish as the Latest release'
        type: boolean
        default: false
      title:
        description: 'Release title'
        type: string
        default: 'Fork build'
      notes:
        description: 'Release notes (markdown)'
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: github.repository != 'rebelonion/Dantotsu'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      # Caches dependencies and the Gradle build cache, so unchanged modules are not recompiled.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode keystore
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "$KEYSTORE_FILE" | base64 -d > "$GITHUB_WORKSPACE/key.keystore"
          fi

      - name: Build googleAlpha
        run: |
          if [ -s "$GITHUB_WORKSPACE/key.keystore" ]; then
            echo "Signing with the repository keystore"
            ./gradlew assembleGoogleAlpha --no-daemon --stacktrace --build-cache -Pabis=arm64-v8a \
              -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/key.keystore \
              -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
              -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
              -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"
          else
            echo "No keystore secret set; falling back to the throwaway debug key"
            ./gradlew assembleGoogleAlpha --no-daemon --stacktrace --build-cache -Pabis=arm64-v8a
          fi

      - name: Checksums
        run: |
          cd app/build/outputs/apk/google/alpha
          ls -l
          sha256sum *.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: dantotsu-fork-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/google/alpha/*arm64-v8a*.apk
            app/build/outputs/apk/google/alpha/*universal*.apk
          if-no-files-found: error
          # APKs are already zipped; skipping recompression speeds the upload.
          compression-level: 0
          retention-days: 30

      - name: Publish release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ ! -s "$GITHUB_WORKSPACE/key.keystore" ]; then
            echo "::error::No keystore secret set. Refusing to release a debug-signed build; it would not install over the previous one."
            exit 1
          fi
          DAY=$(TZ=Asia/Kolkata date +%Y%m%d)
          N=$(gh release list --repo "$GITHUB_REPOSITORY" -L 100 --json tagName -q ".[].tagName" | grep -c "^r$DAY-" || true)
          TAG="r$DAY-$((N + 1))"
          APKS=app/build/outputs/apk/google/alpha
          gh release create "$TAG"             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --latest             --title "$TITLE"             --notes "$NOTES"             "$APKS/app-google-arm64-v8a-alpha.apk"             "$APKS/app-google-universal-alpha.apk"
